<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
	<title id="title">RockStarLab profile icon concept</title>
	<desc id="desc">A flat gradient RockStarLab profile icon with a star, lab bubbles, and orbital motion.</desc>
	<defs>
		<linearGradient id="buttonGradient" x1="74" y1="74" x2="438" y2="438" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#a855f7"/>
			<stop offset="0.5" stop-color="#6366f1"/>
			<stop offset="1" stop-color="#06b6d4"/>
		</linearGradient>
		<linearGradient id="badgeGradient" x1="139" y1="116" x2="377" y2="390" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#111827"/>
			<stop offset="1" stop-color="#07131a"/>
		</linearGradient>
		<linearGradient id="starGradient" x1="192" y1="157" x2="324" y2="334" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#dffbff"/>
		</linearGradient>
		<filter id="softShadow" x="-22%" y="-22%" width="150%" height="155%">
			<feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#111827" flood-opacity="0.3"/>
		</filter>
	</defs>
	<rect width="512" height="512" rx="92" fill="url(#buttonGradient)"/>
	<g opacity="0.2" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round">
