		<path d="M256 106l126 73v146l-126 73-126-73V179l126-73Z" fill="none" stroke="#fff" stroke-width="5" opacity="0.1"/>
		<path d="M106 275c43-70 112-107 207-109 39-1 73 7 103 23" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.28"/>
		<path d="M385 161l33 31-43 12" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.34"/>
		<path d="M256 148l31 71 77 7-58 51 17 76-67-40-67 40 17-76-58-51 77-7 31-71Z" fill="url(#starGradient)"/>
