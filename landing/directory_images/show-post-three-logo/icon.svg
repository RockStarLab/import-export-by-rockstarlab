<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
	<title id="title">Show Post Three logo concept</title>
	<desc id="desc">A flat gradient icon showing a selected parent post branching into child posts.</desc>
