<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
	<title id="title">Animated Import Export by RockStarLab icon</title>
	<desc id="desc">An animated flat gradient icon showing data moving from one site window to another.</desc>
	<defs>
		<linearGradient id="buttonGradient" x1="74" y1="74" x2="438" y2="438" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#a855f7"/>
			<stop offset="0.5" stop-color="#6366f1"/>
			<stop offset="1" stop-color="#06b6d4"/>
		</linearGradient>
		<filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
			<feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#111827" flood-opacity="0.28"/>
		</filter>
		<style>
			.background-line {
				animation: lineDrift 4.4s ease-in-out infinite;
			}

			.source-window {
				transform-origin: 145px 235px;
				animation: sourcePulse 2.8s cubic-bezier(.23, 1, .32, 1) infinite;
			}

			.target-window {
				transform-origin: 367px 277px;
				animation: targetPulse 2.8s cubic-bezier(.23, 1, .32, 1) infinite;
			}

			.flow-arrow {
				transform-origin: 258px 235px;
				animation: arrowPulse 2.8s cubic-bezier(.23, 1, .32, 1) infinite;
			}

			.flow-dot {
				animation: dotFlow 2.8s cubic-bezier(.23, 1, .32, 1) infinite;
			}

			.flow-dot.two {
				animation-delay: .18s;
			}

			.flow-dot.three {
				animation-delay: .36s;
			}

			@keyframes lineDrift {
				0%, 100% {
					transform: translateX(0);
					opacity: .2;
				}

				50% {
					transform: translateX(14px);
					opacity: .28;
				}
			}

			@keyframes sourcePulse {
				0%, 100% {
					transform: scale(1);
				}

				18% {
					transform: scale(1.035);
				}
			}

			@keyframes targetPulse {
				0%, 45%, 100% {
					transform: scale(1);
				}

				62% {
					transform: scale(1.035);
				}
			}

			@keyframes arrowPulse {
				0%, 100% {
					transform: translateX(0);
					opacity: .94;
				}

				45% {
					transform: translateX(8px);
					opacity: 1;
				}
			}

			@keyframes dotFlow {
				0% {
					transform: translateX(-34px) scale(.7);
					opacity: 0;
				}

				20% {
					opacity: .92;
				}

				58% {
					transform: translateX(30px) scale(1);
					opacity: .9;
				}

				82%, 100% {
					transform: translateX(58px) scale(.7);
					opacity: 0;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.background-line,
				.source-window,
				.target-window,
				.flow-arrow,
				.flow-dot {
					animation: none;
				}
			}
		</style>
	</defs>
	<rect width="512" height="512" rx="92" fill="url(#buttonGradient)"/>
	<g class="background-line" opacity="0.2" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round">
		<path d="M109 158h58"/>
		<path d="M345 354h58"/>
		<path d="M111 374h34"/>
		<path d="M367 136h32"/>
	</g>
	<g filter="url(#softShadow)">
		<g class="source-window">
			<rect x="74" y="164" width="142" height="142" rx="28" fill="#10131f" opacity="0.92"/>
			<rect x="104" y="197" width="82" height="55" rx="8" fill="#fff" opacity="0.92"/>
			<path d="M113 272h64" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity="0.72"/>
		</g>
		<g class="target-window">
			<rect x="296" y="206" width="142" height="142" rx="28" fill="#10131f" opacity="0.92"/>
			<rect x="326" y="239" width="82" height="55" rx="8" fill="#fff" opacity="0.92"/>
			<path d="M335 314h64" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity="0.72"/>
		</g>
		<g class="flow-arrow">
			<path d="M210 235h78" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
			<path d="M272 205 316 235 272 265" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
		</g>
		<circle class="flow-dot" cx="232" cy="273" r="12" fill="#fff" opacity="0.9"/>
		<circle class="flow-dot two" cx="256" cy="273" r="12" fill="#fff" opacity="0.72"/>
		<circle class="flow-dot three" cx="280" cy="273" r="12" fill="#fff" opacity="0.54"/>
	</g>
	<path d="M74 139c57-28 119-42 186-42 69 0 129 13 178 38" fill="none" stroke="#fff" stroke-width="4" opacity="0.13"/>
</svg>
